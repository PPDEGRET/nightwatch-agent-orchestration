<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Reported historical seven of seven task run</title>
  <desc id="desc">Sanitized reconstruction card based on my report of one historical Nightwatch run completing seven of seven planned tasks. Raw evidence is excluded and the outcome is not independently reproduced.</desc>
