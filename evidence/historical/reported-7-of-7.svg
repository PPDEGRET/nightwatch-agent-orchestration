  <rect x="48" y="48" width="904" height="464" rx="24" fill="#121a23" stroke="#273748"/>
  <text x="92" y="115" fill="#f4b860" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">REPORTED HISTORICAL OUTCOME</text>
  <text x="92" y="238" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="112" font-weight="700">7 / 7</text>
  <text x="92" y="294" fill="#b7c4d0" font-family="Arial, sans-serif" font-size="28">planned tasks reported complete</text>
  <line x1="92" y1="350" x2="908" y2="350" stroke="#273748"/>
  <text x="92" y="405" fill="#8fa3b8" font-family="Arial, sans-serif" font-size="20">First-person report · raw run excluded</text>
