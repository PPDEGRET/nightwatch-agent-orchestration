[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch-case-study"
version = "1.0.0"
description = "Portable, offline-first demonstration of bounded overnight agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
nightwatch = "nightwatch.cli:main"

[tool.setuptools.packages.find]
include = ["nightwatch*"]

[tool.setuptools.package-data]
"nightwatch.data" = ["*.json"]
